# GoReleaser config for the claude-kit binary. Run by .github/workflows/release.yml on a vX.Y.Z tag.
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: claude-kit

before:
  hooks:
    - go vet ./...

builds:
  - id: claude-kit
    main: ./cmd/claude-kit
    binary: claude-kit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true # CHANGELOG.md is the changelog

release:
  github:
    owner: horac3
    name: claude-kit
  footer: |
    Install: `npx @horac3/claude-kit@{{ .Version }} init` · `go install github.com/horac3/claude-kit/cmd/claude-kit@{{ .Tag }}` · or download a binary below.
    What changed: see [CHANGELOG.md](https://github.com/horac3/claude-kit/blob/{{ .Tag }}/CHANGELOG.md).
