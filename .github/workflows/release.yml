name: release

# Push a tag that matches VERSION (e.g. VERSION 1.5.0 → tag v1.5.0) to release:
#   1. tests (shell suite + Go), 2. GoReleaser builds 6 binaries and a GitHub Release with checksums,
#   3. npm packages are built from those binaries and published with provenance (platform packages first).
# `go install github.com/horac3/claude-kit/cmd/claude-kit@vX.Y.Z` works from the tag itself.
#
# Secrets: NPM_TOKEN, an npm automation token allowed to publish the @horac3 scope.
# (Or configure npm trusted publishing for this workflow and drop the token.)

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag must match VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $file"
            exit 1
          fi
          echo "VERSION=$file" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S warning -x install.sh tests/run.sh kit/.claude/hooks/*.sh kit/.claude/kit/*.sh stacks/ts/.claude/kit/*.sh
          git config --global init.defaultBranch main
          bash tests/run.sh
          go vet ./...
          go test ./...

      # On a re-run (e.g. after an npm failure) the GitHub Release already holds the binaries: rebuild them locally
      # for npm, but don't upload again (GitHub rejects duplicate asset names).
      - name: Release already on GitHub?
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
          if [ "${n:-0}" -gt 0 ]; then
            echo "release $GITHUB_REF_NAME already has $n assets: building without publishing"
            echo "skip=--skip=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.existing.outputs.skip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build npm packages
        run: node npm/build.mjs --version "$VERSION" --dist dist --out dist/npm

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish() { # skip versions already on the registry, so a failed run can be re-run safely
            name="$(node -p "require('./$1/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "already published: $name@$VERSION"
            else
              (cd "$1" && npm publish --provenance --access public)
            fi
          }
          for d in dist/npm/claude-kit-*/; do publish "${d%/}"; done
          publish dist/npm/claude-kit

      - name: Smoke test the published package
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke && git init -q && printf 'module example.com/x\n\ngo 1.22\n' > go.mod
          for i in 1 2 3 4 5; do npx -y "@horac3/claude-kit@$VERSION" version && break; sleep 20; done
          npx -y "@horac3/claude-kit@$VERSION" init .
          grep -q '^via=npm' .claude/kit/manifest
