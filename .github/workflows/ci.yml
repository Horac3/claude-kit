name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck -S warning -x install.sh tests/run.sh kit/.claude/hooks/*.sh kit/.claude/kit/*.sh stacks/ts/.claude/kit/*.sh

  go:
    # The claude-kit binary: vet, unit tests, and the integration test proving `claude-kit init` installs exactly
    # what install.sh installs. Windows runs it through Git Bash. It's the first Windows job in CI (1.2.1 was tested by
    # hand), so it doesn't block merges until it has proven stable.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: git config --global init.defaultBranch main
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu: full suite, including the real pnpm + vitest project.
          - os: ubuntu-latest
            bash: bash
            ts: "1"
          # macOS: the system bash 3.2, which the kit has to support. /bin goes first on PATH
          # so hooks and scripts started with plain "bash" also get 3.2, not Homebrew's bash.
          - os: macos-latest
            bash: /bin/bash
            ts: "0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.ts == '1'
        run: npm install -g pnpm@9
      - name: tests/run.sh
        env:
          KIT_TEST_TS: ${{ matrix.ts }}
        run: |
          if [ "${{ matrix.os }}" = macos-latest ]; then export PATH="/bin:$PATH"; fi
          bash --version | head -1
          git config --global init.defaultBranch main
          ${{ matrix.bash }} tests/run.sh
